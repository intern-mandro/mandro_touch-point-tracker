[versions]
agp                 = "8.7.3"
kotlin              = "2.1.0"
ksp                 = "2.1.0-1.0.29"
# 2.52 는 Kotlin 2.1 메타데이터를 못 읽는다 (hiltJavaCompile 단계에서
# "unsupported metadata version" 으로 죽음). 2.56 이상이어야 한다.
hilt                = "2.56.2"

coreKtx             = "1.15.0"
lifecycle           = "2.8.7"
activityCompose     = "1.9.3"
composeBom          = "2024.12.01"
navigationCompose   = "2.8.5"
coroutines          = "1.9.0"
serialization       = "1.7.3"

room                = "2.6.1"
datastore           = "1.1.1"
documentfile        = "1.0.1"

junit               = "4.13.2"
junitExt            = "1.2.1"
espresso            = "3.6.1"
robolectric         = "4.14.1"
truth               = "1.4.4"
turbine             = "1.2.0"

[libraries]
# ── AndroidX Core ─────────────────────────────────────────────
androidx-core-ktx           = { group = "androidx.core",       name = "core-ktx",               version.ref = "coreKtx" }
androidx-documentfile       = { group = "androidx.documentfile", name = "documentfile",         version.ref = "documentfile" }

# ── Lifecycle ─────────────────────────────────────────────────
lifecycle-runtime           = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",     version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel         = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-ktx",   version.ref = "lifecycle" }

# ── Compose ───────────────────────────────────────────────────
compose-bom                 = { group = "androidx.compose",    name = "compose-bom",            version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test             = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest    = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-activity            = { group = "androidx.activity",   name = "activity-compose",       version.ref = "activityCompose" }
compose-viewmodel           = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-navigation          = { group = "androidx.navigation", name = "navigation-compose",     version.ref = "navigationCompose" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Coroutines ────────────────────────────────────────────────
coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }

# ── Serialization (JSON 내보내기) ─────────────────────────────
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# ── DI: Hilt ─────────────────────────────────────────────────
hilt-android                = { group = "com.google.dagger",   name = "hilt-android",            version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",   name = "hilt-android-compiler",   version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",       name = "hilt-navigation-compose", version = "1.2.0" }

# ── 로컬 DB: Room (세션 · 터치포인트) ─────────────────────────
room-runtime                = { group = "androidx.room",       name = "room-runtime",           version.ref = "room" }
room-ktx                    = { group = "androidx.room",       name = "room-ktx",               version.ref = "room" }
room-compiler               = { group = "androidx.room",       name = "room-compiler",          version.ref = "room" }
room-testing                = { group = "androidx.room",       name = "room-testing",           version.ref = "room" }

# ── DataStore (캡처 설정) ─────────────────────────────────────
datastore-preferences       = { group = "androidx.datastore",  name = "datastore-preferences",  version.ref = "datastore" }

# ── 테스트 ────────────────────────────────────────────────────
junit                       = { group = "junit",                  name = "junit",          version.ref = "junit" }
junit-ext                   = { group = "androidx.test.ext",      name = "junit",          version.ref = "junitExt" }
espresso-core               = { group = "androidx.test.espresso", name = "espresso-core",  version.ref = "espresso" }
robolectric                 = { group = "org.robolectric",        name = "robolectric",    version.ref = "robolectric" }
truth                       = { group = "com.google.truth",       name = "truth",          version.ref = "truth" }
turbine                     = { group = "app.cash.turbine",       name = "turbine",        version.ref = "turbine" }

[plugins]
android-application         = { id = "com.android.application",                   version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
ksp                         = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
